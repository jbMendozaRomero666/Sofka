plugins {
    id 'java'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {

    // JUnit
    testImplementation platform('org.junit:junit-bom:6.0.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.junit.platform:junit-platform-suite'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Cucumber
    testImplementation 'io.cucumber:cucumber-junit-platform-engine:7.21.1'

    // Serenity BDD
    testImplementation 'net.serenity-bdd:serenity-core:5.3.7'
    testImplementation 'net.serenity-bdd:serenity-cucumber:5.3.7'
    testImplementation 'net.serenity-bdd:serenity-screenplay:5.3.3'

    // Web
    testImplementation 'net.serenity-bdd:serenity-screenplay-webdriver:5.3.7'
}

test {
    useJUnitPlatform()
}